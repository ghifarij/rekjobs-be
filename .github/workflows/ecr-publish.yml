name: Build & Push Docker Image to AWS ECR

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  build-and-push:
    environment: Production
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG_SHA: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" \
            -t "$ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG_SHA}" \
            .

      - name: Push Docker image tags
        run: |
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG_SHA}"

      - name: Output image URIs
        run: |
          echo "Pushed image:"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "$ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG_SHA}"
