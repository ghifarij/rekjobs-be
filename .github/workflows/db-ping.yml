name: Keep Supabase DB Alive

on:
  schedule:
    # Runs every Monday and Thursday at 08:00 UTC
    - cron: '0 8 * * 1,4'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  ping-database:
    name: Ping Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get install -y postgresql-client

      - name: Ping database with SELECT 1
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          echo "Pinging Supabase database at $(date -u)..."
          psql "$DATABASE_URL" -c "SELECT 1;" --no-password
          echo "Database ping successful!"
